<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Sokudoku · 마법사의 작은 모험</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #edf0f7;
      color: #24314d;
      font:
        16px system-ui,
        sans-serif;
    }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 32px 20px;
    }
    h1 {
      font-size: 30px;
    }
    p {
      line-height: 1.7;
    }
    nav {
      display: flex;
      gap: 12px;
      margin: 24px 0;
    }
    button {
      font: inherit;
      padding: 12px 20px;
      border: 1px solid #b8c6dc;
      border-radius: 12px;
      background: white;
      color: inherit;
      cursor: pointer;
    }
    section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }
    article {
      padding: 16px;
      background: #fff;
      border-radius: 18px;
      text-align: center;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1;
      margin: auto;
      image-rendering: pixelated;
    }
    h3 {
      font-size: 18px;
      margin: 10px 0;
    }
    .dark {
      background: #151c2e;
      color: #e4ebfc;
    }
    .dark article,
    .dark button {
      background: #25314a;
    }
    .dark button {
      border-color: #586b91;
    }
    @media (max-width: 550px) {
      section {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      main {
        padding: 20px 12px;
      }
      article {
        padding: 8px;
      }
    }
  </style>
  <main>
    <h1>마법사의 작은 모험</h1>
    <p>백발 마법사와 네 식물 친구들. 불·물·번개·바람으로 모험해요.</p>
    <nav>
      <button id="pause">움직임 멈추기</button
      ><button id="theme">어두운 배경</button>
    </nav>
    <h2>마법사</h2>
    <section id="mage"></section>
    <h2>식물 몬스터</h2>
    <section id="plants"></section>
    <h2>네 가지 마법</h2>
    <section id="magic"></section>
    <h2>머리 위 작은 감정들</h2>
    <section id="emotions"></section>
    <p id="status" role="status"></p>
  </main>
  <script>
    const assets = {
      emotions: { src: "../battle/emotion-v1.png", cols: 8, cell: 64 },
      mage: { src: "../battle/mage-v5.png", cols: 4, cell: 128 },
      plants: { src: "../battle/mandrakes-v5.png", cols: 6, cell: 96 },
      magic: { src: "../battle/magic-v5.png", cols: 6, cell: 96 },
    };
    const clips = [
      ["emotions", "기쁨 · 떠오르는 하트", [0,1,2,3,4,5,6,7,-1,-1], 140],
      ["emotions", "혼란 · 꼬이는 낙서", [8,9,10,11,12,13,14,15,-1,-1,-1,-1], 110],
      ["emotions", "분노 · 움찔하는 마크", [16,17,18,19,20,21,22,23,-1,-1,-1,-1], 90],
      ["mage", "대기", [0, 0, 0, 1, 2, 3], 350],
      ["mage", "마법 시전", [4, 5, 6, 7, 0, 0], 150],
      ["mage", "실패 · 넘어짐", [4, 5, 8, 9, 10, 11, 11], 150],
      ["mage", "일어나기", [12, 13, 14, 15], 220],
      ["mage", "기쁨", [16, 17, 18, 16], 200],
      ["mage", "격려", [15, 15, 0, 15], 450],
      ["mage", "휴식", [19, 2], 1500],
      ["mage", "승리", [16, 17, 18, 17, 16, 16], 180],
      ...["새싹 무", "단풍 뿌리", "꽃봉오리", "고사리"].map((name, i) => [
        "plants",
        name,
        [0, 1, 0, 2, 3, 4, 5, 5].map((f) => i * 6 + f),
        230,
      ]),
      ...["불", "물", "번개", "바람"].map((name, i) => [
        "magic",
        name,
        [0, 1, 2, 3, 4, 5].map((f) => i * 6 + f),
        110,
      ]),
    ];
    let paused = matchMedia("(prefers-reduced-motion: reduce)").matches,
      elapsed = 0,
      last = 0;
    const button = document.querySelector("#pause");
    function label() {
      button.textContent = paused ? "움직임 재생" : "움직임 멈추기";
      button.setAttribute("aria-pressed", String(paused));
    }
    label();
    button.onclick = () => {
      paused = !paused;
      label();
    };
    document.querySelector("#theme").onclick = (e) => {
      const dark = document.body.classList.toggle("dark");
      e.target.textContent = dark ? "밝은 배경" : "어두운 배경";
    };
    for (const clip of clips) {
      const a = document.createElement("article"),
        c = document.createElement("canvas"),
        h = document.createElement("h3");
      c.width = 384;
      c.height = 384;
      c.setAttribute("aria-label", clip[1]);
      h.textContent = clip[1];
      a.append(c, h);
      document.getElementById(clip[0]).append(a);
      clip.push(c);
    }
    Promise.all(
      Object.values(assets).map(
        (a) =>
          new Promise((resolve, reject) => {
            a.image = new Image();
            a.image.onload = resolve;
            a.image.onerror = reject;
            a.image.src = a.src;
          }),
      ),
    )
      .then(() => requestAnimationFrame(render))
      .catch(
        () =>
          (document.getElementById("status").textContent =
            "이미지를 불러오지 못했어요. 새로고침해주세요."),
      );
    function render(now) {
      if (last && !paused) elapsed += Math.min(100, now - last);
      last = now;
      for (const [key, , frames, step, c] of clips) {
        const a = assets[key],
          f = frames[Math.floor(elapsed / step) % frames.length],
          ctx = c.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, 384, 384);
        if (key === "emotions") {
          const row = Math.floor(frames[0] / 8);
          const mageFrame = row === 0 ? 16 : row === 1 ? 15 : 0;
          ctx.drawImage(assets.mage.image, (mageFrame % 4) * 128, Math.floor(mageFrame / 4) * 128, 128, 128, 32, 64, 300, 300);
          if (f >= 0) ctx.drawImage(a.image, (f % 8) * 64, Math.floor(f / 8) * 64, 64, 64, 230, 32, 108, 108);
          continue;
        }
        ctx.drawImage(
          a.image,
          (f % a.cols) * a.cell,
          Math.floor(f / a.cols) * a.cell,
          a.cell,
          a.cell,
          0,
          0,
          384,
          384,
        );
      }
      requestAnimationFrame(render);
    }
  </script>
</html>
